joiner:
  - {item: "Account created and plan assigned", auto: people_applied}
  - {item: "Role and access groups assigned", auto: people_applied}
  - {item: "Multi-factor method registered", auto: mfa_registered}
  - {item: "Device enrolled and compliant", auto: device_compliant, when_plan: business_premium}
