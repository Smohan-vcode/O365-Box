# Delegated scopes the audit sign-in requests (SPEC §26, SC-26, T16-01),
# with the Microsoft Graph Command Line Tools client. Read-only only: a test
# (engine/internal/audit) fails on any scope that could write, send or
# manage, and `box audit` refuses to sign in with one.
#
# The person signing in holds Global Reader (plus Security Reader and a
# Purview reader role for the Defender and Purview reads). The token is
# held in memory only and dropped when the pack is written (R12). No app
# registration, certificate or tenant write.
client: microsoft-graph-command-line-tools
delegated:
  - User.Read.All                          # users, guests, last sign-in
  - Group.Read.All
  - Directory.Read.All
  - Organization.Read.All                  # tenant, verified domains
  - Domain.Read.All                        # password expiry per domain
  - Policy.Read.All                        # Conditional Access, authorization, security defaults, device registration, auth methods policy
  - RoleManagement.Read.Directory          # directory role assignments
  - UserAuthenticationMethod.Read.All      # MFA registration details
  - AuditLog.Read.All                      # directory audit, sign-ins, signInActivity
  - Reports.Read.All                       # authentication methods registration report
  - Application.Read.All                   # app registrations and their credential expiry (never the secret)
  - DeviceManagementConfiguration.Read.All # compliance and configuration policies
  - DeviceManagementManagedDevices.Read.All
  - DeviceManagementApps.Read.All          # app protection policies
  - DeviceManagementServiceConfig.Read.All # enrolment settings
  - DeviceManagementRBAC.Read.All
  - DeviceLocalCredential.ReadBasic.All    # LAPS backup dates only, never a password
  - SharePointTenantSettings.Read.All      # tenant sharing settings
  - Sites.Read.All
  - SecurityEvents.Read.All                # secure score
  - SecurityAlert.Read.All                 # alerts over the period
  - IdentityRiskyUser.Read.All             # risky users (Entra ID P2 tenants)
  - InformationProtectionPolicy.Read       # sensitivity labels
  - RecordsManagement.Read.All             # retention labels

# Workloads read through their own PowerShell modules (T16-06): the policy
# steps' verify for Exchange Online, Security & Compliance (Purview),
# SharePoint (PnP) and Teams. Each needs a delegated token for its own
# resource. `client` is the public client the token is issued to: empty
# means the client above, and the Graph sign-in's refresh token is redeemed
# for the resource (in memory only); otherwise the audit asks for one more
# device-code sign-in with that client (one per client, for every resource
# it serves), as the same person. These are Microsoft's own clients for the
# modules named: Entra pre-authorises them for their resources, which a
# first-party client such as the Graph tools is not.
#
# These tokens carry the module's management scope, which is not read-only
# by name: what keeps the reads read-only is the person's roles. So a token
# is requested, and handed to a provider worker, only when every directory
# role of the person who signed in can only read, and each token must be
# for that same person (tenant and object id) with no other role. The
# worker also runs in read-only mode: test, verify and evidence only, and
# any module cmdlet whose verb could change the tenant is refused.
#
# Roles the reader needs, all read-only:
#   exchange    Global Reader (Exchange's Global Reader role group); Security
#               Reader for the anti-spam and Defender policies
#   compliance  Global Reader and Security Reader (Purview role groups of the
#               same names); labels, DLP and retention may also need a
#               custom Purview role group with the View-Only DLP Compliance
#               Management, View-Only Retention Management, Sensitivity Label
#               Reader and View-Only Audit Logs roles. Never Compliance
#               Administrator: it can write.
#   sharepoint  Global Reader (tenant settings and the site list; it cannot
#               open a site's content, so per-site reads stay not read)
#   teams       Global Reader
#
# resource: an https resource or an application id; {sharepoint_admin} is
# the tenant's SharePoint admin host, from its initial domain.
# credential: the name the provider worker reads it under (Get-BoxAuth).
resources:
  - name: exchange
    title: Exchange Online
    resource: https://outlook.office365.com
    client: fb78d390-0c51-40cd-8e17-fdbfab77341b   # Exchange Online PowerShell
    provider: exchange
    credential: app
  - name: compliance
    title: Security & Compliance (Purview)
    resource: https://ps.compliance.protection.outlook.com
    client: fb78d390-0c51-40cd-8e17-fdbfab77341b   # the same client: no second sign-in
    provider: exchange
    credential: ipps
  - name: sharepoint
    title: SharePoint admin
    resource: "{sharepoint_admin}"
    client: 9bc3ab49-b65d-410a-85ad-de819febfddc   # SharePoint Online Management Shell
    provider: sharepoint
    credential: app
  - name: teams
    title: Microsoft Teams
    resource: 48ac35b8-9aa8-4d74-927d-1f4a14a0b239  # Skype and Teams Tenant Admin API
    client: 12128f48-ec9e-42f0-b203-ea49fb6af367   # Microsoft Teams PowerShell
    provider: teams
    credential: teams
  # Connect-MicrosoftTeams -AccessTokens needs its Graph token from the same
  # client as the Teams token; redeemed from the Teams sign-in, no extra code.
  - name: teams-graph
    title: Microsoft Graph for Teams
    resource: https://graph.microsoft.com
    client: 12128f48-ec9e-42f0-b203-ea49fb6af367   # Microsoft Teams PowerShell
    provider: teams
    credential: teamsgraph
