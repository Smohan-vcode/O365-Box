# Steps of the identity provider: Entra users, groups, break-glass accounts,
# authentication methods and Conditional Access (T1). One Microsoft module
# per provider (spike S-05).
provider: identity
modules: []   # Graph over REST (common/BoxGraph.psm1)
steps:
  - id: identity.break-glass
    title: Break-glass accounts and exclusion group
    track: T1
    task: T1-01
    reads: [tenant, users]
  - id: identity.gate-g02
    title: FIDO2 keys registered for break-glass accounts
    check_only: true
    reads: [tenant, users]
  - id: identity.users
    title: Users and licences
    track: T1
    task: T1-02
    depends_on: [identity.break-glass]
    reads: [tenant, company, users]
  - id: identity.groups
    title: Access groups and role groups
    track: T1
    task: T1-03
    depends_on: [identity.users]
    reads: [groups, users, company, values]   # values: groups a choice suggests (defaults/structure.yaml choice_groups)
  - id: identity.auth-methods
    title: Authentication methods and MFA registration report
    track: T1
    task: T1-05
    depends_on: [identity.break-glass]
    reads: [tenant, users]   # gate G-02 check for CA01 readiness (T14-17)
  - id: identity.directory-settings
    title: Directory settings (app registration, consent, guests, admin consent workflow)
    track: T1
    task: T1-05
    depends_on: [identity.groups]
  - id: identity.conditional-access
    title: Conditional Access policies
    track: T1
    task: T1-05
    depends_on: [identity.groups, identity.auth-methods]
    capabilities: [conditional_access]
    fallback: identity.security-defaults
    reads: [tenant, users]
  - id: identity.security-defaults
    title: Security defaults (fallback without Conditional Access)
    track: T1
    task: T1-05
    fallback_only: true
  - id: policy.capabilities
    title: Licences provide every capability the resolved settings need
    track: T14
    task: T14-02
    depends_on: [identity.users]
    reads: ["@policy", tenant, users, company]
  # Resolved policy settings (T14-04). policy.entra owns the Conditional
  # Access policies, authentication methods and directory properties its
  # mappings name; identity.conditional-access, identity.auth-methods and
  # identity.directory-settings leave those to it (BoxIdentityPolicy.psm1).
  - id: policy.entra
    title: Entra ID policy settings (Conditional Access, sign-in methods, directory, device registration)
    track: T14
    task: T14-04
    depends_on: [identity.groups, identity.conditional-access, identity.directory-settings, identity.auth-methods]
    reads: ["@policy", tenant, users, modules, company, structure]   # company, structure: ENT-026 terms (company names, Admin site Dictionary)
  - id: policy.m365-admin
    title: Microsoft 365 admin centre settings (idle timeout, password expiry, apps and services, third-party storage)
    track: T14
    task: T14-04
    depends_on: [identity.groups]
    reads: ["@policy", tenant]
  - id: policy.teams.identity
    title: Teams settings held in Entra (who can create groups and teams)
    track: T14
    task: T14-04
    depends_on: [identity.groups, policy.entra]
    reads: ["@policy", tenant]
  - id: policy.purview.identity
    title: Purview settings read through Graph (audit log sources for the weekly export)
    track: T14
    task: T14-04
    depends_on: [identity.groups]
    reads: ["@policy", tenant]
