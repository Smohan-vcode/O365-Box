# DRAFT jurisdiction rules (SPEC §19.1). Not reviewed by counsel; not legal
# advice. Rules only: no company values. Confirm every rule with counsel
# before relying on it.
#
# Ireland. Extends eu: GDPR, NIS2, DORA and Cyber Resilience Act duties are
# in eu.yaml; this file adds the national rules.
code: ie
name: Ireland
extends: eu
status: DRAFT
reviewed_on: null
sources:
  - Companies Act 2014 (section 151, particulars on letters, order forms and websites; section 285, accounting records)
  - Data Protection Act 2018 and GDPR; Data Protection Commission
  - National Cyber Security Centre (NCSC Ireland, national CSIRT)
  - Taxes Consolidation Act 1997 (record keeping); Revenue
correspondence:
  required: [legal_name, place_of_registration, registration_number, registered_office, directors]
  conditional:
    share_capital: share capital is mentioned at all (state paid-up capital)
    liquidation_status: the company is being wound up
  website: [legal_name, place_of_registration, registration_number, registered_office]
  notes: Business letters and order forms, including in electronic form, and websites state the company name, place of registration, registered number and registered office address. Letters also list the directors (first name and surname, and nationality if not Irish); check with counsel for the exact form.
privacy:
  regime: GDPR and Data Protection Act 2018
  regulator: Data Protection Commission
  representative_required_if_outside: true
notices: [PS-PRIV, PS-COOKIES]
retention_hints:
  accounting_records: "6y (Companies Act 2014 s. 285)"
  tax: "6y (Revenue)"
incident_notifications:
  - regime: NIS2 (Irish transposition)
    what: Significant incident
    to: National Cyber Security Centre or the sector competent authority
    deadline: "24 hours early warning, 72 hours notification and one month final report under NIS2 Art. 23; check with counsel whether the Irish transposing law is in force and its exact terms"
    applies_when: Essential or important entity under the Irish NIS2 law
