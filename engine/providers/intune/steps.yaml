# Steps of the intune provider: Device enrolment, compliance and app protection (T1-04).
# One Microsoft module per provider (spike S-05). Steps are added by the
# tasks named above; each needs a handler in Box.intune.psm1.
provider: intune
modules: []   # Graph over REST (common/BoxGraph.psm1)
steps:
  - id: policy.intune-windows
    title: Windows device policies from the resolved settings (compliance, BitLocker, firewall, antivirus, ASR, LAPS, update rings)
    track: T14
    task: T14-05
    module: devices
    depends_on: [identity.groups]
    reads: ["@policy", tenant, devices]
  - id: policy.sharepoint.intune
    title: OneDrive sync limited to the company tenant on Windows devices (SPO-011)
    track: T14
    task: T14-05
    module: devices
    depends_on: [policy.intune-windows]
    reads: ["@policy", tenant]
  - id: policy.intune-macos
    title: macOS device policies from the resolved settings
    track: T14
    task: T14-06
    module: devices
    depends_on: [identity.groups]
    reads: ["@policy", devices]
  - id: policy.intune-mobile
    title: Phone and tablet compliance, app protection and enrolment restrictions from the resolved settings
    track: T14
    task: T14-07
    module: devices
    depends_on: [identity.groups]
    reads: ["@policy", devices]
  - id: policy.m365-apps
    title: Office app policies (settings catalogue) from the resolved settings
    track: T14
    task: T14-05
    module: devices
    depends_on: [identity.groups]
    reads: ["@policy", ai_policy]
  - id: intune.gate-g12
    title: Phone enrolment restrictions set in the Intune admin centre (gate G-12, MOB-001)
    check_only: true
    reads: []
