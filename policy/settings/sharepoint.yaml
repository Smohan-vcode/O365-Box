# SharePoint and OneDrive: master settings.
# mode: enforce | staged (audit or report-only first, then enforce) | report (evidence only)
# value is the intended state in words; the setting resolution task (track T14) resolves each to the exact API setting and records it in expected-state/setting-ids.json.
admin_centre: SharePoint and OneDrive
settings:
- id: SPO-001
  platform: all
