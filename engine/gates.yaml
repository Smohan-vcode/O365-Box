# Gates: manual steps the orchestrator checks (SPEC §22). `check` names a
# provider step with check_only: true whose verify operation decides the
# gate; the task that builds that provider fills it in. A gate without a
# check passes only when confirmed with `box gate <id> --confirm`.
gates:
  - id: G-00
    title: Microsoft 365 sign-up
    guide: Sign up for Microsoft 365 for your company (Business Premium recommended), then return and sign in.
    expected: A tenant you can sign in to as Global Administrator
    check_task: T0-04
  - id: G-01
    title: Licences bought
    guide: Buy the plans chosen for your team in the Microsoft 365 admin centre, under Billing.
    expected: Subscribed plans cover every person in step 6
    check_task: T1-02
  - id: G-02
    title: Security keys registered
    guide: Register two FIDO2 security keys for each break-glass account and seal one set offline.
    expected: Each break-glass account lists a FIDO2 method
    check: identity.gate-g02
    check_task: T1-01
  - id: G-03
    title: Flow owner connections
    guide: Signed in as the flow owner, create the connections the solution asks for in Power Automate.
    expected: One connection per connector in the allow-list
    check_task: T5-01
  - id: G-04
    title: Public forms created
    guide: Create the NDA request and demo request forms from flows/forms/ and paste each form link.
    expected: Form links reachable; IDs stored in configuration ids
    check_task: T8-01
  - id: G-05
    title: Founder's standing admin role removed
    guide: Remove the founder's Global Administrator role after the identity track passes.
    expected: The founder holds no directory role
    check_task: T1-05
  - id: G-06
    title: Manual DNS records
    guide: Add the DNS records shown at your DNS host.
    expected: Records resolve to the expected values
    check_task: T2-03
  # Gates a choice adds (defaults/choices.yaml effects.gates, SPEC §24).
  - id: G-07
    title: Cloud Sync agent installed
    guide: On a server joined to your Active Directory, install the Microsoft Entra Cloud Sync agent and sign it in, then return.
    expected: The Cloud Sync configuration reports a healthy agent
    check_task: T15-01
  - id: G-08
    title: Azure subscription created
    guide: Create a pay-as-you-go Azure subscription in the Azure portal, signed in as a Global Administrator, then return.
    expected: One enabled Azure subscription in the tenant
    check_task: T15-03
  - id: G-09
    title: Domain registrar locked down
    guide: At the company that sold your domain, turn on registrar lock, two-step sign-in and auto-renew.
    expected: Registrar lock on (checked from WHOIS where the registrar publishes it); two-step sign-in and auto-renew confirmed
    check_task: T15-02
  - id: G-10
    title: Setup app registered in Power Platform
    guide: In the Power Platform admin centre, register the setup app as a management application (a two-minute step).
    expected: The pipeline app is listed as a Power Platform management application
    check_task: T0-07
  - id: G-11
    title: Teams meeting policy set by hand
    guide: "Microsoft does not let apps change the Teams meeting policy (SC-28). In the Teams admin centre, open Meetings > Meeting policies > Global (Org-wide default) and set: Who can bypass the lobby = People in my org (not guests); People dialing in can bypass the lobby = Off; Anonymous users can start a meeting = Off; Who can present = Organizers, but users can override; External participants can give or request control = Off; Meeting recording = On; Transcription = On; Recordings automatically expire = On, after 365 days. Save, then return: the box checks the values."
    expected: The Global meeting policy matches TMS-004 to TMS-008 (box check teams.gate-g11)
    check: teams.gate-g11
    check_task: T14-09
  - id: G-12
    title: Phone enrolment restrictions set
    guide: >-
      In the Intune admin centre, under Devices > Enrollment > Device platform restriction,
      create an iOS/iPadOS restriction and an Android restriction that allow the platform but
      block personally owned devices, and block Android device administrator. Assign them to
      the pilot group first; assign them to all users when the owner enforces device policies.
      Intune does not let the setup app make these (MOB-001, SC-29).
    expected: iOS and Android work profile restrictions block personal enrolment and Android device administrator is blocked (default restriction, or a per-platform restriction assigned to a group)
    check: intune.gate-g12
    check_task: T14-07
