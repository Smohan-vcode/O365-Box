# Steps of the sharepoint provider: tenant sharing, hub and sites,
# libraries and folders, the register lists and the configuration store
# (T3, T0-06). One Microsoft module per provider (spike S-05).
provider: sharepoint
modules: [PnP.PowerShell]
steps:
  - id: sharepoint.tenant
    title: Tenant sharing settings
    track: T3
    task: T3-01
    module: records
  - id: sharepoint.sites
    title: Hub and sites
    track: T3
    task: T3-01
    module: records
    depends_on: [sharepoint.tenant, identity.groups]
    reads: [tenant, structure, users]
  - id: sharepoint.libraries
    title: Libraries, folders and permissions
    track: T3
    task: T3-02
    module: records
    depends_on: [sharepoint.sites]
    reads: [structure]
  - id: sharepoint.register
    title: Register lists
    track: T3
    task: T3-03
    module: records
    depends_on: [sharepoint.libraries]
    reads: [tenant, users, structure]
  - id: sharepoint.config-store
    title: Configuration store and Dictionary
    track: T0
    task: T0-06
    depends_on: [sharepoint.register]
    reads: ["@document", "@dictionary", company, tenant, structure]
  - id: sharepoint.control-tasks
    title: Recurring control tasks
    track: T10
    task: T10-02
    # The records come from the policy and procedure documents (module
    # policies); the lists are the register's and the artefacts go to the
    # Compliance site's Evidence library (both module records).
    module: policies
    depends_on: [sharepoint.register, sharepoint.libraries]
    reads: ["@controltasks", tenant, structure, users]
  - id: policy.sharepoint
    title: Resolved sharing and site settings
    track: T14
    task: T14-09
    depends_on: [sharepoint.tenant, sharepoint.sites]
    reads: ["@policy", tenant, structure]
  - id: sharepoint.policies
    title: Policy documents in the Compliance site (drafts, owner approval, PDF publication)
    track: T9
    task: T9-01
    module: policies
    depends_on: [sharepoint.libraries, sharepoint.register]
    reads: ["@policies", tenant, structure]
  - id: sharepoint.extension-requests
    title: Edge extension requests open to staff (they ask; the owner decides)
    track: T14
    task: T14-18
    module: devices
    depends_on: [sharepoint.register, identity.groups]
    reads: [tenant, structure, users]
