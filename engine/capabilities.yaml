# Plan to capability map (SPEC §20.3). Discovery (T0-04) reads the tenant's
# subscribed plans; until then the orchestrator uses tenant.default_plan.
# Step manifests list the capabilities they need and their fallbacks.
# The policy catalogue (policy/capabilities.yaml) uses the second group of
# names on each plan; `box policy validate` checks the two files agree.
plans:
  business_basic: [exchange, sharepoint, teams, onedrive, forms, approvals, power_automate_standard,
    free, power_platform, purview_audit]
  business_standard: [exchange, sharepoint, teams, onedrive, forms, approvals, power_automate_standard, desktop_apps,
    free, power_platform, purview_audit, m365_apps]
  business_premium: [exchange, sharepoint, teams, onedrive, forms, approvals, power_automate_standard, desktop_apps,
    entra_p1, conditional_access, intune, defender_business, defender_office_p1, information_protection,
    free, power_platform, purview_audit, m365_apps, intune_p1, defender_o365_p1, purview_ip, purview_dlp_core]
# Subscribed SKU part numbers (Graph subscribedSkus) mapped to plans (S-08).
skus:
  SPB: business_premium
  O365_BUSINESS_PREMIUM: business_standard
  O365_BUSINESS_ESSENTIALS: business_basic
