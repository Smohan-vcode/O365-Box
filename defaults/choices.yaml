# Choices: every decision an owner makes in onboarding (SPEC §24).
#
# Each choice is asked in plain language in one window (the TUI), with the
# recommended option preselected, discovery pre-filling what Microsoft
# already knows (`detect`), and the cost of each option stated. The answer
# is stored in the configuration document under `choices: {id: value}`
# and can be changed later from the home screen (plan, then apply).
#
# Effects of an option:
#   modules:     modules switched on or off
#   variants:    setting id -> variant key in expected-state/setting-ids
#   exceptions:  setting ids not applied while this option holds
#   bundles:     permission bundles the pipeline app needs (expected-state/app-permissions.yaml)
#   gates:       manual steps the option adds (engine/gates.yaml, SPEC §22)
# `when` limits a choice to companies where it applies (a module or a detected fact).
# `recommended_when` overrides `recommended` for a condition.
# `essential` / `strict` name the option the careful dial (below) picks at
# that level; a choice without one keeps its default.
# Engine data: no company values.

# The careful dial (SPEC §25.3): one question that sets policy.tier and the
# default of every choice. `pick` says which per-choice answer a level uses.
# The owner can still fine-tune each choice afterwards.
dial:
  question: How careful should we be?
  help: This sets how strict your security is. Every level protects sign-in, email, files and devices; stricter levels cost your staff a little more convenience. You can change it later from the home screen.
  levels:
    - value: essential
      label: Essential
      detail: The must-haves for every company, with the fewest interruptions for staff. Fewer forced sign-outs; attachments arrive while they are checked.
      tier: core
      pick: essential
    - value: recommended
      label: Recommended
      detail: What we suggest for most companies. Strong protection for sign-in, email, files and devices, with sensible choices for your staff.
      tier: core
      pick: recommended
      recommended: true
    - value: strict
      label: Strict
      detail: For sensitive or regulated work. Adds the stricter settings, stronger phone passcodes and newest software only, and blocks sign-in with a code.
      tier: enhanced
      pick: strict

choices:

  # ---------- Structure step: what the company runs ----------
  - id: directory.mode
    step: structure
    question: Where do your staff accounts live?
    help: Microsoft 365 keeps a directory of your staff. Some companies also run their own Active Directory servers in an office.
    detect: organization.onPremisesSyncEnabled
    options:
      - value: cloud
        label: In Microsoft 365 only
        detail: No servers to run. Windows PCs join Microsoft Entra and are managed by Intune.
        recommended: true
        cost: none
      - value: hybrid
        label: Also on our own Active Directory servers
        detail: Adds Microsoft Entra Cloud Sync, which copies accounts and passwords from your servers. Hardening the servers themselves stays a checklist.
        cost: none (needs an existing server for the sync agent)
        effects: {modules: [hybrid], gates: [G-07]}

  - id: azure.subscription
    step: structure
    question: Do you use Microsoft Azure?
    help: Azure is Microsoft's cloud for servers and apps. It is separate from Microsoft 365 and billed only for what you run in it.
    detect: azure.subscriptions
    options:
      - value: existing
        label: Yes, secure our existing subscription
        detail: Applies the free Azure safety settings (§C of SC-23).
        when: detected
        recommended: true
        cost: none
        effects: {modules: [azure], bundles: [azure]}
      - value: create
        label: Not yet, help me create one
        detail: We show you how to create a pay-as-you-go subscription, then secure it. Nothing is billed until you create resources.
        cost: none until resources are created
        effects: {modules: [azure], bundles: [azure], gates: [G-08]}
      - value: none
        label: No, we do not use Azure
        detail: Azure settings are left out. You can add them later.
        recommended_when: not detected
        cost: none

  - id: domain.registrar
    step: addresses
    question: Who registered your web address (domain)?
    help: The company that sells your domain name controls it. If someone takes over that account, they can take over your email.
    options:
      - value: guided
        label: Guide me through locking it down
        detail: Registrar lock, two-step sign-in on the registrar account, and auto-renew. A short checklist, checked by us where the registrar allows.
        recommended: true
        cost: none
        effects: {gates: [G-09]}
      - value: later
        label: I will do this later
        detail: Listed as an open item on the home screen.
        cost: none

  - id: automation.governance
    step: structure
    question: Govern Power Automate and Power Apps?
    help: Staff can build automations that move company data. Governance blocks risky connectors and AI features.
    options:
      - value: yes
        label: Yes
        detail: An administrator registers the setup app once in Power Platform (a two-minute step we guide).
        recommended: true
        cost: none
        effects: {bundles: [powerplatform], gates: [G-10]}
      - value: later
        label: Later
        detail: The Power Platform settings are listed as not applied.
        cost: none
        effects: {exceptions: [PPL-001, PPL-002, PPL-003, PPL-004, PPL-005, PPL-006, PPL-007]}

  - id: data.protection
    step: structure
    question: Label and protect sensitive documents and email?
    help: Sensitivity labels and data loss prevention stop confidential files and personal data leaving the company. Included in Business Premium.
    options:
      - value: yes
        label: Yes, start in audit mode
        detail: Labels are published to a pilot group first; data loss prevention starts in test mode and reports before it blocks.
        recommended: true
        cost: none
        effects: {bundles: [purview]}
      - value: later
        label: Later
        cost: none
        effects: {exceptions: [OFC-013, PVW-003, PVW-004, PVW-005, PVW-006, PVW-007, PVW-008, PVW-010, PVW-011, PVW-012, PVW-013, PVW-014, PVW-015, PVW-016, PVW-017, PVW-018, PVW-019, PVW-020]}

  # ---------- Security step: how strict ----------
  - id: signin.device_code
    step: security
    strict: block
    question: Allow sign-in with a code on another device?
    help: Some tools, including this setup tool when run without a browser, sign in by showing a code you enter on your phone. Attackers also misuse this.
    options:
      - value: allow
        label: Allow for now
        detail: Recommended while you are setting up. Turn it off later from the home screen.
        recommended: true
        cost: none
        effects: {exceptions: [ENT-012]}
      - value: block
        label: Block
        detail: Strongest. This setup tool must then be used from a computer with a browser.
        cost: none

  - id: signin.mfa_snooze_days
    step: security
    question: How long may staff put off setting up the Microsoft Authenticator app?
    help: After signing in, anyone without the app is asked to set it up. They can say "not now" three times; after that they must set it up before they continue. This is how long each "not now" lasts.
    options:
      - value: "0"
        label: Ask at every sign-in
        detail: The fastest way to get everyone protected; staff are asked each time they sign in until they set it up.
        cost: none
        effects: {values: {values.mfa_snooze_days: "0"}}
      - value: "1"
        label: One day
        detail: Staff are asked again the next day, so everyone is set up within a few days.
        recommended: true
        cost: none
        effects: {values: {values.mfa_snooze_days: "1"}}
      - value: "7"
        label: One week
        detail: Gentler; everyone is set up within about a month.
        cost: none
        effects: {values: {values.mfa_snooze_days: "7"}}

  # ---------- Security step: values only the company supplies (SPEC §25, T14-04) ----------
  - id: signin.banned_passwords
    step: security
    question: Stop staff using the company's own names in passwords?
    help: Attackers try a company's name, web address and products first. Microsoft already blocks common passwords; this adds your own names.
    options:
      - value: company
        label: Yes, block our company and product names
        detail: Your trading name, legal name and web address, and the product names you list in the Dictionary (company.product_names). They follow your company details when those change.
        recommended: true
        cost: none
      - value: none
        label: No, only Microsoft's list of common passwords
        cost: none
        effects: {exceptions: [ENT-026]}

  - id: data.personal_mail_domains
    step: security
    question: Watch for company files sent to personal email accounts?
    help: Staff sometimes send work files to their own personal email, where the company cannot protect them. We can ask for a reason when someone mails an attachment to a free personal email service, and warn you when someone mails their own personal address. This needs a list of those services.
    options:
      - value: common
        label: Yes, for the common free email services
        detail: Gmail, Outlook.com, Hotmail, Live, Yahoo, iCloud, Proton and AOL. You can change the list later from the home screen.
        recommended: true
        cost: none
        effects: {values: {policy.consumer_mail_domains: "gmail.com, outlook.com, hotmail.com, live.com, yahoo.com, icloud.com, proton.me, aol.com"}}
      - value: none
        label: No, do not watch mail to personal accounts
        detail: Attachments can be mailed to personal accounts without a reason being asked.
        cost: none
        effects: {exceptions: [PVW-017, PVW-018]}

  - id: signin.managed_plan_users
    step: security
    question: Who must use a managed computer or a protected app for company data?
    help: Company data opens only on computers the company manages and, on phones, in apps that protect it. This needs a plan that includes device management (Business Premium).
    options:
      - value: plan
        label: Everyone on Business Premium
        detail: We keep a group, plan-business_premium, of the people you put on Business Premium, and apply the rule to it.
        recommended: true
        cost: none
        effects: {values: {values.managed_plan_group: plan-business_premium}}
      - value: all
        label: All users
        detail: Also covers anyone on a plan without device management; they cannot open company data until their device is managed.
        cost: none
        effects: {variants: {ENT-004: all-users, ENT-005: all-users}}

  - id: devices.join
    step: security
    question: Who may join Windows PCs to the company (Microsoft Entra)?
    help: Joining a Windows PC makes it a company computer. Limiting who can do it stops a stolen account adding an attacker's PC.
    when: module devices
    options:
      - value: admins
        label: Only administrators
        detail: We keep a group, grp-device-join, holding your administrators (grp-admins). Anyone else who sets up PCs can be added to it.
        recommended: true
        cost: none
        effects: {values: {values.device_join_group: grp-device-join}}
      - value: all
        label: Any member of staff
        detail: Anyone can join a PC with their own account (two-step sign-in still applies).
        cost: none
        effects: {variants: {ENT-039: all-users}}

  - id: forms.external_responses
    step: security
    question: Can people outside the company fill in your Microsoft Forms?
    help: Public forms (for example an NDA request or a demo request on your website) need this on.
    options:
      - value: on
        label: Yes
        detail: Needed for public forms.
        recommended_when: module sales
        cost: none
        effects: {exceptions: [ADM-005]}
      - value: off
        label: No
        recommended: true
        cost: none

  - id: ai.copilot
    step: security
    question: Copilot and AI features
    help: Decide what your AI policy allows. You can change this any time.
    options:
      - value: off
        label: Off until our AI policy approves them
        recommended: true
        cost: none
        effects: {variants: {ADM-010: off}}
      - value: chat
        label: Copilot Chat on, web search off
        cost: none
        effects: {variants: {ADM-010: chat-no-web}}

  - id: devices.windows_store
    step: security
    question: Microsoft Store on company Windows PCs
    help: The old "company store" no longer exists. Apps can be installed for staff by Intune instead.
    when: module devices
    options:
      - value: intune
        label: Store app off; we install apps through Intune
        recommended: true
        cost: none
        effects: {variants: {WIN-058: intune}}
      - value: open
        label: Leave the Store on
        cost: none
        effects: {exceptions: [WIN-058]}

  - id: devices.android_personal_passcode
    step: security
    strict: high
    question: Passcode on staff's own Android phones
    help: Android lets companies require a passcode strength on personal phones, not an exact length.
    when: module devices
    options:
      - value: medium
        label: Medium (at least 4 digits, no simple patterns)
        recommended: true
        cost: none
        effects: {variants: {MOB-005: medium}}
      - value: high
        label: High (at least 8 characters)
        cost: none
        effects: {variants: {MOB-005: high}}

  - id: mail.safe_attachments
    step: security
    essential: dynamic
    question: Suspicious email attachments
    help: Attachments are opened in a safe place before delivery.
    options:
      - value: block
        label: Hold the email until the attachment is checked
        recommended: true
        cost: none
        effects: {variants: {DEF-013: block}}
      - value: dynamic
        label: Deliver the text now and the attachment once checked
        detail: Applies only to people outside the standard protection presets.
        cost: none
        effects: {variants: {DEF-013: dynamic}}

  - id: session.idle_timeout
    step: security
    essential: unmanaged_only
    question: Sign people out of web apps when idle?
    options:
      - value: one_hour
        label: After 1 hour, on every device
        recommended: true
        cost: none
        effects: {variants: {ADM-003: one-hour}}
      - value: unmanaged_only
        label: Only limit sign-in time on personal devices
        detail: Uses the 12-hour sign-in frequency on unmanaged devices instead.
        cost: none
        effects: {exceptions: [ADM-003]}

  - id: storage.default_location
    step: security
    question: Save files to company storage by default?
    help: Desktop and Documents folders are kept in OneDrive, so files are backed up and covered by company policies.
    when: module devices
    options:
      - value: onedrive
        label: Yes
        recommended: true
        cost: none
        effects: {variants: {OFC-011: kfm}}
      - value: leave
        label: No, leave it to each person
        cost: none
        effects: {exceptions: [OFC-011]}

  # ---------- Security step: device values (suggested, the owner confirms) ----------
  - id: devices.windows_minimum
    step: security
    strict: win11_24h2
    question: Oldest Windows version allowed on company PCs
    help: Older versions stop getting security fixes. PCs below this are marked not compliant and lose access until updated.
    when: module devices
    options:
      - value: win11_23h2
        label: Windows 11 version 23H2 or later
        detail: Every Windows 11 release still getting security fixes.
        recommended: true
        cost: none
        effects: {values: {devices.windows.minimum_os_version: "10.0.22631"}}
      - value: win11_24h2
        label: Windows 11 version 24H2 or later
        detail: Stricter; older Windows 11 PCs must update first.
        cost: none
        effects: {values: {devices.windows.minimum_os_version: "10.0.26100"}}

  - id: devices.windows_feature_update
    step: security
    question: Which Windows 11 release should company PCs move to?
    help: Windows gets one big update a year. We hold PCs on the release you pick until you choose the next one.
    when: module devices
    options:
      - value: "24h2"
        label: Windows 11, version 24H2
        detail: The widely deployed release, well tested by businesses.
        recommended: true
        cost: none
        effects: {values: {devices.windows.feature_update_version: "Windows 11, version 24H2"}}
      - value: "25h2"
        label: Windows 11, version 25H2
        detail: The newest release.
        cost: none
        effects: {values: {devices.windows.feature_update_version: "Windows 11, version 25H2"}}

  - id: devices.apple_android_minimum
    step: security
    strict: latest
    question: Oldest Mac, iPhone and Android versions allowed
    help: Devices below these versions get a warning, then lose access to company data until updated.
    when: module devices
    options:
      - value: supported
        label: Versions that still get security fixes
        detail: macOS 15, iOS 18 and Android 13 or later. Warn below these; block iOS below 17 and Android below 12.
        recommended: true
        cost: none
        effects:
          values:
            devices.macos.minimum_version: "15.0"
            devices.ios.minimum_version: "18.0"
            devices.ios.block_below_version: "17.0"
            devices.android.minimum_version: "13.0"
            devices.android.block_below_version: "12.0"
      - value: latest
        label: Latest versions only
        detail: macOS 26, iOS 26 and Android 14 or later. Strongest; some older phones cannot update.
        cost: none
        effects:
          values:
            devices.macos.minimum_version: "26.0"
            devices.ios.minimum_version: "26.0"
            devices.ios.block_below_version: "18.0"
            devices.android.minimum_version: "14.0"
            devices.android.block_below_version: "13.0"

  - id: devices.update_time
    step: security
    question: When may Macs install required updates?
    help: When an update is due, Macs install it at this time so nobody is interrupted mid-work.
    when: module devices
    options:
      - value: night
        label: Overnight, at 2 a.m.
        recommended: true
        cost: none
        effects: {values: {values.update_install_time: "02:00"}}
      - value: lunch
        label: Lunchtime, at 12:30
        cost: none
        effects: {values: {values.update_install_time: "12:30"}}

  - id: devices.disk_recovery
    step: security
    question: What should staff see when a Mac's disk is locked?
    help: Mac disks are encrypted. If someone forgets their password, the recovery key is held by your company in Microsoft Intune.
    when: module devices
    options:
      - value: it
        label: '"Contact IT: your recovery key is held by the company"'
        recommended: true
        cost: none
        effects: {values: {values.filevault_escrow_location: "Your company IT team (Microsoft Intune)"}}
      - value: helpdesk
        label: '"Contact the help desk"'
        cost: none
        effects: {values: {values.filevault_escrow_location: "The company help desk"}}

  - id: devices.browser_extensions
    step: security
    question: Browser extensions in Microsoft Edge
    help: Extensions can read everything on a web page, including company data.
    when: module devices
    options:
      - value: approved
        label: Only extensions the company approves
        detail: None at first; add any you need from the home screen.
        recommended: true
        cost: none
        effects: {values: {values.edge_extension_allowlist: ""}}
      - value: store
        label: Anything from the Microsoft Edge store
        cost: none
        effects: {exceptions: [MAC-030]}
